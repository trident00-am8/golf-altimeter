<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>해발고도 측정기</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="해발고도">
  <meta name="theme-color" content="#eef2ff">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #eef2ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .title {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .altitude {
      font-size: 96px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -4px;
      line-height: 1;
    }
    .altitude.waiting { color: #cbd5e1; }
    .unit {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    .status {
      font-size: 14px;
      color: #94a3b8;
      font-style: italic;
      margin-bottom: 56px;
      min-height: 20px;
      text-align: center;
    }
    .status.active  { color: #16a34a; font-style: normal; font-weight: 600; }
    .status.error   { color: #dc2626; font-style: normal; }
    .status.warning { color: #d97706; font-style: normal; }
    .btn-main {
      width: 100%;
      max-width: 320px;
      padding: 18px;
      border-radius: 16px;
      border: none;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-stop  { background: #fee2e2; color: #dc2626; }
    .btn-start { background: #dcfce7; color: #16a34a; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulsing { animation: pulse 1.6s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="title">⛳ Golf Altimeter</div>
  <div class="altitude waiting pulsing" id="alt">—</div>
  <div class="unit">해발 m</div>
  <div class="status" id="status">GPS 신호 수신 중...</div>
  <button class="btn-main btn-stop" id="mainBtn" onclick="toggleMeasure()">⏹ 측정 중지</button>

<script>
  let pollInterval = null;
  let isRunning = false;

  const $alt    = document.getElementById('alt');
  const $status = document.getElementById('status');
  const $main   = document.getElementById('mainBtn');

  startGPS();

  function startGPS() {
    if (!navigator.geolocation) { setStatus('error', 'GPS 미지원 기기'); return; }
    isRunning = true;
    setStatus('waiting', 'GPS 신호 수신 중...');
    setBtnState(true);
    fetch(); // 즉시 1회
    pollInterval = setInterval(fetch, 3000); // 3초마다 강제 갱신
  }

  function fetch() {
    navigator.geolocation.getCurrentPosition(onPos, onErr,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
  }

  function stopGPS() {
    clearInterval(pollInterval);
    pollInterval = null;
    isRunning = false;
  }

  function onPos(pos) {
    const alt = pos.coords.altitude;
    if (alt !== null && alt !== undefined) {
      $alt.className = 'altitude';
      $alt.textContent = Math.round(alt);
      setStatus('active', '측정 중');
    } else {
      $alt.className = 'altitude waiting pulsing';
      $alt.textContent = '—';
      setStatus('warning', 'GPS 확인됨 · 고도 데이터 대기 중');
    }
  }

  function onErr(err) {
    const msgs = { 1: '위치 권한 필요', 2: 'GPS 신호 없음', 3: '수신 시간 초과' };
    $alt.className = 'altitude waiting';
    $alt.textContent = '—';
    setStatus('error', msgs[err.code] || 'GPS 오류');
  }

  function toggleMeasure() {
    if (isRunning) {
      stopGPS();
      $alt.className = 'altitude waiting';
      $alt.textContent = '—';
      setStatus('stopped', '측정 중지됨');
      setBtnState(false);
    } else {
      startGPS();
    }
  }

  function setStatus(type, msg) {
    $status.textContent = msg;
    $status.className = 'status ' + type;
  }
  function setBtnState(on) {
    $main.className   = on ? 'btn-main btn-stop' : 'btn-main btn-start';
    $main.textContent = on ? '⏹ 측정 중지' : '▶ 측정 시작';
  }
</script>
</body>
</html>
